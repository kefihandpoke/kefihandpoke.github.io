<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kefi Handpoke • Booking</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F1E5CE;
      font-family: Arial, sans-serif;
      color: #33231A;
      text-align: center;
    }

    .container {
      padding: 40px 25px;
      max-width: 500px;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 3px;
      margin: 0 0 15px;
      font-weight: 500;
    }

    .intro {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .language {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 16px 28px;
      border: 1px solid #33231A;
      background: transparent;
      color: #33231A;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 14px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    .language:hover {
      background: #33231A;
      color: #F1E5CE;
    }

    .options {
      display: none;
      margin-top: 30px;
    }

    .options-title {
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
      padding: 14px 20px;
      border: 1px solid #33231A;
      background: transparent;
      color: #33231A;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1.5px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    .option:hover {
      background: #33231A;
      color: #F1E5CE;
    }

    .back {
      border: none;
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-decoration: underline;
    }

    .footer {
      margin-top: 35px;
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.7;
    }

    #copyMessage {
      display: none;
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>KEFI HANDPOKE</h1>

    <div class="intro">
      BOOK A TATTOO<br>
      OR ASK A QUESTION
    </div>

    <!-- LANGUAGE SELECTION -->

    <div id="languageSelection">

      <button class="language" onclick="chooseLanguage('en')">
        ENGLISH
      </button>

      <button class="language" onclick="chooseLanguage('pt')">
        PORTUGUÊS
      </button>

    </div>


    <!-- EMAIL OPTIONS -->

    <div id="emailOptions" class="options">

      <div class="options-title">
        CHOOSE HOW TO SEND YOUR EMAIL
      </div>

      <!-- APPLE MAIL / DEFAULT EMAIL APP -->

      <a
        id="mailApp"
        class="option"
        href="#"
      >
        ✉ &nbsp; OPEN EMAIL APP
      </a>


      <!-- GMAIL -->

      <a
        id="gmail"
        class="option"
        href="#"
        target="_blank"
        rel="noopener"
      >
        GMAIL
      </a>


      <!-- OUTLOOK -->

      <a
        id="outlook"
        class="option"
        href="#"
        target="_blank"
        rel="noopener"
      >
        OUTLOOK
      </a>


      <!-- BROWSER -->

      <a
        id="browserMail"
        class="option"
        href="#"
        target="_blank"
        rel="noopener"
      >
        OPEN EMAIL IN BROWSER
      </a>


      <!-- COPY EMAIL -->

      <button
        class="option"
        onclick="copyEmail()"
      >
        COPY EMAIL ADDRESS
      </button>

      <div id="copyMessage">
        EMAIL ADDRESS COPIED
      </div>


      <!-- BACK -->

      <button
        class="option back"
        onclick="goBack()"
      >
        ← BACK
      </button>

    </div>


    <div class="footer">
      CHOOSE YOUR LANGUAGE
    </div>

  </div>


  <script>

    const email = "kefihandpoke@hotmail.com";

    const englishSubject =
      "Tattoo Booking • Questions - Kefi Handpoke";

    const portugueseSubject =
      "Marcação de Tattoo • Dúvidas - Kefi Handpoke";


    const englishBody =
`Hello Kefi,

I would love to get a tattoo with you or clarify some doubts.

Here are my details,

City where I would like to get tattooed:
My name:
My Instagram:
My email:
My availability (days and times):

• I would like to describe my tattoo idea in detail:
• I would like to share the story behind the tattoo or what inspires me to get it:

Placement on the body:
Tattoo size (in cm):`;


    const portugueseBody =
`Olá Kefi,

Gostaria de fazer uma tatuagem contigo ou esclarecer algumas dúvidas.

Aqui estão os meus dados:

Cidade onde gostaria de fazer a tatuagem:
Nome:
Instagram:
Email:
Disponibilidade (dias e horários):

• Gostaria de descrever a minha ideia de tatuagem em detalhe:
• Gostaria de partilhar a história por trás da tatuagem ou o que me inspira a fazê-la:

Localização no corpo:
Tamanho da tatuagem (em cm):`;


    let currentLanguage = "en";


    function chooseLanguage(language) {

      currentLanguage = language;

      document.getElementById("languageSelection").style.display = "none";
      document.getElementById("emailOptions").style.display = "block";

      const subject =
        language === "en"
          ? englishSubject
          : portugueseSubject;

      const body =
        language === "en"
          ? englishBody
          : portugueseBody;


      const encodedSubject =
        encodeURIComponent(subject);

      const encodedBody =
        encodeURIComponent(body);


      /*
        APPLE MAIL / DEFAULT EMAIL APP
      */

      const mailto =
        `mailto:${email}?subject=${encodedSubject}&body=${encodedBody}`;

      document.getElementById("mailApp").href = mailto;


      /*
        GMAIL
      */

      const gmailURL =
        `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${encodedSubject}&body=${encodedBody}`;

      document.getElementById("gmail").href = gmailURL;


      /*
        OUTLOOK
      */

      const outlookURL =
        `https://outlook.live.com/mail/0/deeplink/compose?to=${encodeURIComponent(email)}&subject=${encodedSubject}&body=${encodedBody}`;

      document.getElementById("outlook").href = outlookURL;


      /*
        GENERIC BROWSER MAIL
        Uses Gmail as the most universally available web option.
      */

      document.getElementById("browserMail").href = gmailURL;

    }


    function goBack() {

      document.getElementById("emailOptions").style.display = "none";
      document.getElementById("languageSelection").style.display = "block";

      document.getElementById("copyMessage").style.display = "none";

    }


    function copyEmail() {

      navigator.clipboard.writeText(email)
        .then(function() {

          const message =
            document.getElementById("copyMessage");

          message.style.display = "block";

          setTimeout(function() {
            message.style.display = "none";
          }, 2500);

        })
        .catch(function() {

          alert(
            "Email: " + email
          );

        });

    }

  </script>

</body>
</html>
